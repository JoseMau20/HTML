<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Personales - Clínica Pediátrica</title>
    <link rel="stylesheet" href="../css/sistema.css">
    <script defer src="../app.js"></script>
</head>
    <body class="menu-abierto">

        <div id="contenedor-header"></div>
        <div id="contenedor-menu"></div>

        <main class="principal">
            
            <div class="encabezado-vistas">
                <h2>Mis Datos Personales</h2>
            </div>

            <div class="contenedor-formulario">
                <form id="form-datos-personales">
            <div class="grid-formulario">
                
                <div class="grupo-input-tarjeta">
                    <div class="icono-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <div class="contenido-input">
                        <label for="nombre">Nombres</label>
                        <input type="text" id="nombre" value="José Roberto" required>
                    </div>
                </div>
                
                <div class="grupo-input-tarjeta">
                    <div class="icono-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <div class="contenido-input">
                        <label for="apellido">Apellidos</label>
                        <input type="text" id="apellido" value="García Enríquez" required>
                    </div>
                </div>

                <div class="grupo-input-tarjeta">
                    <div class="icono-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </div>
                    <div class="contenido-input">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" value="jose20151227@gmail.com" required>
                    </div>
                </div>

                <div class="grupo-input-tarjeta">
                    <div class="icono-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <div class="contenido-input">
                        <label for="password">Cambiar Contraseña</label>
                        <input type="password" id="password" placeholder="Deja en blanco para no cambiar">
                    </div>
                    
                    <button type="button" class="btn-ver-password" id="btn-toggle-pwd" title="Mostrar contraseña">
                        <svg id="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

            </div>

            <div class="acciones-formulario">
                <button type="submit" class="btn-accion btn-editar">Actualizar Mis Datos</button>
                <button type="button" class="btn-accion btn-eliminar">Cancelar</button>
            </div>
    </form>
            </div>

        </main>

        <div id="contenedor-footer"></div>
    </body>
</html>
