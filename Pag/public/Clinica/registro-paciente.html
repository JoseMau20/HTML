<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente</title>
    <link rel="stylesheet" href="../css/sistema.css">
    <script defer src="../app.js"></script>
</head>
<body class="menu-abierto">
    
    <div id="contenedor-header"></div>
    <div id="contenedor-menu"></div>

        <main class="principal">

            <div class="encabezado-vistas">
                <div>
                    <h2>Registrar Nuevo Paciente</h2>
                    <p class="subtitulo-vista">Complete los datos del paciente y asigne un familiar encargado.</p>
                </div>
                <div class="celda-acciones">
                    <button type="submit" form="form-registro-paciente" class="btn-accion btn-editar">Guardar Paciente</button>
                    <a href="pacientes.html" class="btn-accion btn-desactivar" style="text-decoration: none;">Cancelar</a>
                </div>
            </div>

            <form id="form-registro-paciente">

                <h3 class="titulo-seccion">1. Datos Personales del Paciente</h3>
                <div class="contenedor-formulario">
                    <div class="grid-formulario">
                        
                        <div class="grupo-input-tarjeta">
                            <div class="icono-input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <div class="contenido-input">
                                <label for="nombre_paciente">Nombres</label>
                                <input type="text" id="nombre_paciente" placeholder="Ej. Mateo Alejandro" required>
                            </div>
                        </div>

                        <div class="grupo-input-tarjeta">
                            <div class="icono-input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <div class="contenido-input">
                                <label for="apellido_paciente">Apellidos</label>
                                <input type="text" id="apellido_paciente" placeholder="Ej. López Gómez" required>
                            </div>
                        </div>

                        <div class="grupo-input-tarjeta">
                            <div class="icono-input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            </div>
                            <div class="contenido-input">
                                <label for="fecha_nac_paciente">Fecha de Nacimiento</label>
                                <input type="date" id="fecha_nac_paciente" required>
                            </div>
                        </div>

                        <div class="grupo-input-tarjeta">
                            <div class="icono-input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                            </div>
                            <div class="contenido-input">
                                <label for="genero_paciente">Género</label>
                                <select id="genero_paciente" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Femenino</option>
                                </select>
                            </div>
                        </div>

                        <div class="grupo-input-tarjeta">
                            <div class="icono-input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            </div>
                            <div class="contenido-input">
                                <label for="sangre_paciente">Tipo de Sangre</label>
                                <select id="sangre_paciente" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="1">O Positivo (O+)</option>
                                    <option value="2">O Negativo (O-)</option>
                                    <option value="3">A Positivo (A+)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grupo-input-tarjeta">
                            <div class="icono-input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            </div>
                            <div class="contenido-input">
                                <label for="etnia_paciente">Etnia</label>
                                <select id="etnia_paciente" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="1">Ladino / Mestizo</option>
                                    <option value="2">Maya</option>
                                    <option value="3">Garífuna</option>
                                </select>
                            </div>
                        </div>

                    </div>
                </div>

                <h3 class="titulo-seccion">2. Asignación de Encargado / Familiar</h3>
                
                <div class="contenedor-formulario">
                    
                    <div class="selector-tipo-familiar">
                        <label class="radio-opcion">
                            <input type="radio" name="tipo_ingreso_familiar" value="existente" checked>
                            <span>Familiar Ya Registrado</span>
                        </label>
                        <label class="radio-opcion">
                            <input type="radio" name="tipo_ingreso_familiar" value="nuevo">
                            <span>Registrar Nuevo Familiar</span>
                        </label>
                    </div>

                    <div id="vista-familiar-existente" class="vista-dinamica activa">
                        <div class="grid-formulario">
                            <div class="grupo-input-tarjeta" style="grid-column: 1 / -1; border-color: #2b3a55; box-shadow: 0 0 0 3px rgba(43, 58, 85, 0.1);">
                                <div class="icono-input">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                </div>
                                <div class="contenido-input" style="flex-direction: row; align-items: center; justify-content: space-between;">
                                    <div style="flex: 1;">
                                        <label for="buscar_dpi">Buscar por DPI del Familiar</label>
                                        <input type="text" id="buscar_dpi" placeholder="Ingrese el DPI sin espacios (Ej. 1234567890101)">
                                    </div>
                                    <button type="button" class="btn-accion btn-editar" style="margin-left: 15px; padding: 8px 15px;">Buscar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="vista-familiar-nuevo" class="vista-dinamica">
                        <div class="grid-formulario">
                            
                            <div class="grupo-input-tarjeta">
                                <div class="icono-input">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                </div>
                                <div class="contenido-input">
                                    <label for="dpi_familiar">DPI</label>
                                    <input type="text" id="dpi_familiar" placeholder="13 dígitos sin espacios">
                                </div>
                            </div>

                            <div class="grupo-input-tarjeta">
                                <div class="icono-input">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path></svg>
                                </div>
                                <div class="contenido-input">
                                    <label for="tipo_familiar">Parentesco</label>
                                    <select id="tipo_familiar">
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option value="1">Madre</option>
                                        <option value="2">Padre</option>
                                        <option value="3">Abuelo(a)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grupo-input-tarjeta">
                                <div class="icono-input">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </div>
                                <div class="contenido-input">
                                    <label for="nombre_familiar">Nombres del Familiar</label>
                                    <input type="text" id="nombre_familiar" placeholder="Nombres">
                                </div>
                            </div>

                            <div class="grupo-input-tarjeta">
                                <div class="icono-input">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </div>
                                <div class="contenido-input">
                                    <label for="apellido_familiar">Apellidos del Familiar</label>
                                    <input type="text" id="apellido_familiar" placeholder="Apellidos">
                                </div>
                            </div>

                            <div class="grupo-input-tarjeta">
                                <div class="icono-input">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                </div>
                                <div class="contenido-input">
                                    <label for="telefono_familiar">Teléfono</label>
                                    <input type="tel" id="telefono_familiar" placeholder="Ej. 12345678">
                                </div>
                            </div>

                            <div class="grupo-input-tarjeta">
                                <div class="icono-input">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </div>
                                <div class="contenido-input">
                                    <label for="correo_familiar">Correo Electrónico</label>
                                    <input type="email" id="correo_familiar" placeholder="correo@ejemplo.com">
                                </div>
                            </div>

    

                        </div>
                    </div>

                </div>
            </form>

        </main>

    <div id="contenedor-footer"></div>

</body>
</html>
