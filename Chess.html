<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Ajedrez</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c2c2c;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #board {
            /* Diseño responsive */
            width: 100%;
            max-width: 600px; /* Tamaño máximo en PC */
            aspect-ratio: 1 / 1; /* Mantiene el tablero siempre cuadrado */
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            /* El tamaño de las piezas se adapta a la pantalla, con un máximo de 55px */
            font-size: min(9vw, 55px); 
            cursor: pointer;
            user-select: none;
        }

        .light { background-color: rgb(240, 217, 181); }
        .dark { background-color: rgb(181, 136, 99); }
        .highlight { background-color: rgb(186, 202, 68) !important; }

        .piece-w { color: white; text-shadow: 1px 1px 2px black; }
        .piece-b { color: black; text-shadow: 1px 1px 2px white; }

        #status {
            margin-top: 20px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="board"></div>
    <div id="status">Turno de las Blancas</div>

    <script>
        const game = new Chess();
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');

        let selectedSquare = null;

        const PIECE_SYMBOLS = {
            'w': { 'p': '♙', 'n': '♘', 'b': '♗', 'r': '♖', 'q': '♕', 'k': '♔' },
            'b': { 'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚' }
        };

        const PIECE_VALUES = {
            'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 1000
        };

        function createBoard() {
            boardElement.innerHTML = '';
            const columns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            
            for (let row = 8; row >= 1; row--) {
                for (let col = 0; col < 8; col++) {
                    const squareId = columns[col] + row;
                    const squareDiv = document.createElement('div');
                    
                    squareDiv.classList.add('square');
                    squareDiv.classList.add((row + col) % 2 !== 0 ? 'light' : 'dark');
                    squareDiv.id = squareId;
                    
                    squareDiv.addEventListener('click', () => onSquareClick(squareId));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateBoard();
        }

        function updateBoard() {
            const squares = document.querySelectorAll('.square');
            squares.forEach(sq => {
                sq.innerHTML = ''; 
                sq.classList.remove('highlight');
                
                if (sq.id === selectedSquare) {
                    sq.classList.add('highlight');
                }

                const piece = game.get(sq.id);
                if (piece) {
                    const symbol = PIECE_SYMBOLS[piece.color][piece.type];
                    sq.innerHTML = `<span class="piece-${piece.color}">${symbol}</span>`;
                }
            });

            checkStatus();
        }

        function onSquareClick(squareId) {
            if (game.turn() === 'b' || game.game_over()) return;

            const piece = game.get(squareId);

            if (!selectedSquare) {
                if (piece && piece.color === 'w') {
                    selectedSquare = squareId;
                    updateBoard();
                }
            } else {
                let move = {
                    from: selectedSquare,
                    to: squareId,
                    promotion: 'q' 
                };

                const legalMoves = game.moves({ verbose: true });
                const isLegal = legalMoves.some(m => m.from === move.from && m.to === move.to);

                if (isLegal) {
                    game.move(move);
                    selectedSquare = null;
                    updateBoard();
                    
                    if (!game.game_over()) {
                        statusElement.innerText = "Pensando...";
                        setTimeout(machineMove, 100);
                    }
                } else {
                    if (piece && piece.color === 'w') {
                        selectedSquare = squareId;
                    } else {
                        selectedSquare = null;
                    }
                    updateBoard();
                }
            }
        }

        function evaluateBoard(boardGame) {
            let value = 0;
            const board = boardGame.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const val = PIECE_VALUES[piece.type];
                        value += piece.color === 'w' ? val : -val;
                    }
                }
            }
            return value;
        }

        function minimax(boardGame, depth, isMaximizing) {
            if (depth === 0 || boardGame.game_over()) {
                return evaluateBoard(boardGame);
            }

            const moves = boardGame.moves();

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    boardGame.move(moves[i]);
                    let evalScore = minimax(boardGame, depth - 1, false);
                    boardGame.undo();
                    maxEval = Math.max(maxEval, evalScore);
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    boardGame.move(moves[i]);
                    let evalScore = minimax(boardGame, depth - 1, true);
                    boardGame.undo();
                    minEval = Math.min(minEval, evalScore);
                }
                return minEval;
            }
        }

        function machineMove() {
            let bestValue = Infinity;
            let bestMoves = [];
            const moves = game.moves({ verbose: true });

            for (let i = 0; i < moves.length; i++) {
                const move = moves[i];
                game.move(move);
                
                let boardValue = minimax(game, 1, true); 
                game.undo();

                if (boardValue < bestValue) {
                    bestValue = boardValue;
                    bestMoves = [move];
                } else if (boardValue === bestValue) {
                    bestMoves.push(move);
                }
            }

            if (bestMoves.length > 0) {
                const chosenMove = bestMoves[Math.floor(Math.random() * bestMoves.length)];
                game.move(chosenMove);
            }
            updateBoard();
        }

        function checkStatus() {
            if (game.in_checkmate()) {
                statusElement.innerText = game.turn() === 'w' ? '¡Jaque Mate! Ganan las Negras.' : '¡Jaque Mate! Ganan las Blancas.';
            } else if (game.in_draw() || game.in_stalemate()) {
                statusElement.innerText = '¡Empate!';
            } else {
                statusElement.innerText = game.turn() === 'w' ? 'Turno de las Blancas' : 'Turno de las Negras';
                if (game.in_check()) {
                    statusElement.innerText += ' (¡Jaque!)';
                }
            }
        }

        createBoard();
    </script>
</body>
</html>
