<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Fonda de Doña Olga</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="apps.js"></script>
</head>

<body class="body-login">
    
    <header class="header-login">
        <a href="index.html" class="btn-regresar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
            </svg>
            Regresar al Menú
        </a>
    </header>

    <main class="main-login">
        <div class="tarjeta-login-layout">
            
            <div class="login-logo-columna">
                <div class="branding-restaurante">
                    <h2>Doña Olga</h2>
                    <p>El auténtico sabor de casa</p>
                </div>
            </div>

            <div class="login-form-columna">
                <h2>Iniciar Sesión</h2>
                <form id="form-login" onsubmit="Login(event)">
                    
                    <div class="grupo-input">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                    </div>
                    
                    <div class="grupo-input">
                        <label for="contra">Contraseña</label>
                        <div class="caja-password">
                            <input type="password" id="contra" placeholder="Ingresa tu contraseña" required>
                            <button type="button" class="btn-ver-password" title="Mostrar contraseña">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="opciones-login">
                        <a href="#" class="link-olvido">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <button type="submit" class="btn-principal boton-ingresar">Ingresar</button>
                </form>
            </div>

        </div>
    </main>

</body>
</html>
