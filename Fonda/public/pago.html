<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pago - Fonda de Doña Olga</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="apps.js" defer></script>
</head>
<body>
    
    <header class="header">
        <div class="logo">
            <h2>Doña Olga</h2>
        </div>
    </header>

    <main class="principal contenedor-pago">
        
        <section class="resumen-orden">
            <h2>Resumen de tu pedido</h2>
            <div class="lista-contenedor">
                <ul id="lista-resumen">
                    </ul>
            </div>
            <div class="total-orden">
                <h3>Total a Pagar: <span id="total-pago" class="color-precio">Q 0.00</span></h3>
            </div>
        </section>

        <section class="formulario-pago">
            <h2>Detalles de Envío</h2>
            <form id="form-pago" onsubmit="procesarPago(event)">
                
                <div class="grupo-input">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre-cliente" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="grupo-input">
                    <label>Método de Entrega</label>
                    <select id="metodo-entrega" onchange="toggleDireccion()" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; background: #fff;">
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="recoger">Recoger en local</option>
                        <option value="domicilio">Envío a domicilio</option>
                    </select>
                </div>

                <div class="grupo-input" id="div-direccion" style="display: none;">
                    <label>Dirección de Envío</label>
                    <input type="text" id="direccion-cliente" placeholder="Ej. Zona 1, Ciudad">
                </div>

                <div class="botones-accion">
                    <button type="button" class="btn-cancelar" onclick="cancelarPedido()">Cancelar</button>
                    <button type="submit" class="btn-pagar">Confirmar Orden</button>
                </div>
            </form>
        </section>

    </main>

</body>
</html>
