<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los 7 Hábitos con Kirby - Cómic Completo</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; 
            background-color: #1a252f; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .header-title {
            color: #f1c40f;
            font-size: 2.8em;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px #000;
            text-align: center;
            -webkit-text-stroke: 1px black;
        }
        .comic-container { 
            width: 900px; 
            max-width: 95vw;
            background: #ffffff; 
            border: 8px solid black; 
            box-shadow: 15px 15px 0px black; 
            border-radius: 20px; 
            position: relative; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel { 
            display: none; 
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-direction: column;
        }
        .panel.active { 
            display: flex; 
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px) scale(0.98); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        
        .scene {
            background-color: #87CEEB; /* Sky blue */
            background-image: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            height: 350px;
            position: relative;
            border-bottom: 8px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Grass base */
        .scene::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #7ed6df;
            border-top: 4px solid black;
            background-image: repeating-linear-gradient(45deg, #7ed6df 0, #7ed6df 20px, #68c3cc 20px, #68c3cc 40px);
        }

        .speech-bubble {
            position: absolute;
            top: 20px;
            background: white;
            border: 4px solid black;
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 1.3em;
            font-weight: bold;
            box-shadow: 6px 6px 0px black;
            max-width: 70%;
            text-align: center;
            z-index: 10;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: black transparent transparent transparent;
            display: block;
            width: 0;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -13px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        .svg-container {
            position: relative;
            z-index: 5;
            margin-top: 50px; /* space for bubble */
        }

        .info-box {
            padding: 30px;
            background: #f8f9fa;
        }
        .habit-title {
            font-size: 2.2em;
            color: #e74c3c;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            text-shadow: 2px 2px 0px #000;
            -webkit-text-stroke: 1px black;
        }
        .habit-num {
            background: #f1c40f;
            color: black;
            border: 4px solid black;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            box-shadow: 4px 4px 0px black;
            -webkit-text-stroke: 0px;
            text-shadow: none;
        }
        
        .description {
            font-size: 1.3em;
            line-height: 1.6;
            color: #2c3e50;
            background: white;
            border: 4px solid black;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }

        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 20px 30px;
            background: #ecf0f1;
            border-top: 4px solid black;
        }
        button { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            font-family: inherit; 
            font-weight: bold; 
            border: 4px solid black; 
            background: #3498db; 
            color: white;
            cursor: pointer; 
            border-radius: 10px; 
            box-shadow: 5px 5px 0px black; 
            transition: all 0.1s; 
            text-transform: uppercase;
        }
        button:active { 
            transform: translate(5px, 5px); 
            box-shadow: 0px 0px 0px black; 
        }
        button:disabled { 
            background: #95a5a6; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: 5px 5px 0px #7f8c8d;
        }
        .progress {
            font-weight: bold;
            font-size: 1.4em;
            color: #2c3e50;
        }

        /* Kirby Base SVG Styles embedded in JS */
    </style>
</head>
<body>

    <h1 class="header-title">🌟 Los 7 Hábitos de Kirby 🌟</h1>

    <div class="comic-container" id="comic-container">
        <!-- Panels -->
    </div>

    <script>
        // Funciones auxiliares para dibujar a Kirby y elementos en SVG puro
        const drawKirby = (x, y, scale=1, extras='') => `
            <g transform="translate(${x}, ${y}) scale(${scale})">
                <!-- Pies -->
                <ellipse cx="-20" cy="35" rx="15" ry="8" fill="#d81b60" transform="rotate(-15 -20 35)" stroke="#000" stroke-width="2.5"/>
                <ellipse cx="20" cy="35" rx="15" ry="8" fill="#d81b60" transform="rotate(15 20 35)" stroke="#000" stroke-width="2.5"/>
                <!-- Brazo izquierdo trasero -->
                <ellipse cx="-35" cy="5" rx="12" ry="8" fill="#f8bbd0" stroke="#000" stroke-width="2.5" transform="rotate(-30 -35 5)"/>
                <!-- Cuerpo -->
                <circle cx="0" cy="0" r="40" fill="#f8bbd0" stroke="#000" stroke-width="2.5"/>
                <!-- Brazo derecho (frente) -->
                <ellipse cx="35" cy="5" rx="12" ry="8" fill="#f8bbd0" stroke="#000" stroke-width="2.5" transform="rotate(30 35 5)"/>
                <!-- Cara normal -->
                ${extras.includes('sleep') ? `
                    <!-- Ojos cerrados -->
                    <path d="M -15 -10 Q -10 -5 -5 -10" fill="none" stroke="#000" stroke-width="3"/>
                    <path d="M 5 -10 Q 10 -5 15 -10" fill="none" stroke="#000" stroke-width="3"/>
                    <circle cx="-15" cy="2" r="5" fill="#f06292"/>
                    <circle cx="15" cy="2" r="5" fill="#f06292"/>
                    <!-- Boca durmiendo -->
                    <circle cx="0" cy="5" r="3" fill="#000"/>
                ` : `
                    <!-- Ojos -->
                    <ellipse cx="-10" cy="-10" rx="4" ry="10" fill="#000"/>
                    <ellipse cx="-10" cy="-14" rx="1.5" ry="3" fill="#fff"/>
                    <ellipse cx="10" cy="-10" rx="4" ry="10" fill="#000"/>
                    <ellipse cx="10" cy="-14" rx="1.5" ry="3" fill="#fff"/>
                    <!-- Chapetes -->
                    <ellipse cx="-20" cy="2" rx="6" ry="3" fill="#f06292"/>
                    <ellipse cx="20" cy="2" rx="6" ry="3" fill="#f06292"/>
                    <!-- Boca feliz -->
                    ${extras.includes('talk') ? `
                        <path d="M -5 5 Q 0 15 5 5 Z" fill="#d81b60" stroke="#000" stroke-width="1.5"/>
                    ` : `
                        <path d="M -5 5 Q 0 10 5 5" fill="none" stroke="#000" stroke-width="2.5"/>
                    `}
                `}
                ${extras.replace('sleep','').replace('talk','')}
            </g>
        `;

        const drawWaddleDee = (x, y, scale=1) => `
            <g transform="translate(${x}, ${y}) scale(${scale})">
                <ellipse cx="-15" cy="30" rx="12" ry="6" fill="#f57c00" stroke="#000" stroke-width="2.5"/>
                <ellipse cx="15" cy="30" rx="12" ry="6" fill="#f57c00" stroke="#000" stroke-width="2.5"/>
                <circle cx="0" cy="0" r="35" fill="#ff9800" stroke="#000" stroke-width="2.5"/>
                <path d="M -25 0 Q 0 25 25 0 Q 25 -25 0 -35 Q -25 -25 -25 0 Z" fill="#ffe0b2" stroke="#000" stroke-width="1"/>
                <ellipse cx="-10" cy="-5" rx="3" ry="8" fill="#000"/>
                <ellipse cx="10" cy="-5" rx="3" ry="8" fill="#000"/>
                <ellipse cx="-18" cy="5" rx="4" ry="2" fill="#ffb74d"/>
                <ellipse cx="18" cy="5" rx="4" ry="2" fill="#ffb74d"/>
            </g>
        `;

        const starProp = `<path d="M 0 -20 L 5 -5 L 20 -5 L 8 5 L 12 20 L 0 10 L -12 20 L -8 5 L -20 -5 L -5 -5 Z" fill="#ffeb3b" stroke="#000" stroke-width="2" transform="translate(35, -20) scale(0.8)"/>`;
        const toolboxProp = `<rect x="20" y="-10" width="30" height="25" fill="#e74c3c" stroke="#000" stroke-width="2" rx="3"/><rect x="25" y="-15" width="20" height="5" fill="none" stroke="#000" stroke-width="2"/>`;
        const clockProp = `<circle cx="35" cy="-5" r="15" fill="#fff" stroke="#000" stroke-width="3"/><path d="M 35 -5 L 35 -12 M 35 -5 L 42 0" stroke="#000" stroke-width="2"/><circle cx="35" cy="-20" r="3" fill="#e74c3c"/>`;
        const questionProp = `<text x="-5" y="-45" font-family="Comic Sans MS" font-size="40" font-weight="bold" fill="#000">?</text>`;
        const zzzProp = `<text x="25" y="-35" font-family="Comic Sans MS" font-size="25" font-weight="bold" fill="#000">Z</text><text x="45" y="-45" font-family="Comic Sans MS" font-size="18" font-weight="bold" fill="#000">z</text><text x="55" y="-55" font-family="Comic Sans MS" font-size="12" font-weight="bold" fill="#000">z</text>`;


        const habits = [
            {
                num: "01", title: "Ser proactivo",
                quote: "¡Yo tomo la iniciativa y controlo mi destino! Poyo!",
                explanation: "Las personas proactivas actúan basándose en valores y decisiones conscientes en lugar de reaccionar pasivamente a lo que sucede alrededor.",
                svg: `<svg width="300" height="200" viewBox="-100 -50 200 150">
                        ${drawKirby(0, 40, 1.2, toolboxProp + 'talk')}
                      </svg>`
            },
            {
                num: "02", title: "Empezar con un fin en mente",
                quote: "¡Visualiza la meta antes de empezar a absorber poderes!",
                explanation: "Consiste en tener una visión clara de tus objetivos a largo plazo. Ayuda a vivir con propósito y asegura que cada paso te acerque a la meta.",
                svg: `<svg width="300" height="200" viewBox="-100 -50 200 150">
                        ${drawKirby(0, 40, 1.2, starProp)}
                      </svg>`
            },
            {
                num: "03", title: "Poner primero lo primero",
                quote: "¡Primero a salvar Dream Land, después a comer pasteles!",
                explanation: "Enfatiza priorizar las tareas según su importancia (lo que te acerca a tus metas) y no solo por su urgencia o inmediatez.",
                svg: `<svg width="300" height="200" viewBox="-100 -50 200 150">
                        ${drawKirby(0, 40, 1.2, clockProp)}
                      </svg>`
            },
            {
                num: "04", title: "Pensar en ganar / ganar",
                quote: "¡Si compartimos el Tomate Maxim, ambos recuperamos salud!",
                explanation: "Se basa en buscar acuerdos mutuamente beneficiosos. Entender que el éxito de uno no tiene que ser a expensas del otro; hay suficiente para todos.",
                svg: `<svg width="300" height="200" viewBox="-150 -50 300 150">
                        ${drawKirby(-40, 40, 1, 'talk')}
                        <g transform="translate(40, 40) scale(-1, 1)"> <!-- Keeby (amarillo) -->
                            <ellipse cx="-20" cy="35" rx="15" ry="8" fill="#e65100" stroke="#000" stroke-width="2.5"/>
                            <ellipse cx="20" cy="35" rx="15" ry="8" fill="#e65100" stroke="#000" stroke-width="2.5"/>
                            <ellipse cx="-35" cy="5" rx="12" ry="8" fill="#fff59d" stroke="#000" stroke-width="2.5"/>
                            <circle cx="0" cy="0" r="40" fill="#fff59d" stroke="#000" stroke-width="2.5"/>
                            <ellipse cx="35" cy="5" rx="12" ry="8" fill="#fff59d" stroke="#000" stroke-width="2.5"/>
                            <ellipse cx="-10" cy="-10" rx="4" ry="10" fill="#000"/><ellipse cx="-10" cy="-14" rx="1.5" ry="3" fill="#fff"/>
                            <ellipse cx="10" cy="-10" rx="4" ry="10" fill="#000"/><ellipse cx="10" cy="-14" rx="1.5" ry="3" fill="#fff"/>
                            <ellipse cx="-20" cy="2" rx="6" ry="3" fill="#ffb74d"/><ellipse cx="20" cy="2" rx="6" ry="3" fill="#ffb74d"/>
                            <path d="M -5 5 Q 0 15 5 5 Z" fill="#e65100" stroke="#000" stroke-width="1.5"/>
                        </g>
                      </svg>`
            },
            {
                num: "05", title: "Primero comprender, luego ser comprendido",
                quote: "¿Qué pasa, amigo Waddle Dee? ¡Te escucho!",
                explanation: "Destaca la escucha empática. Escuchar genuinamente para entender el punto de vista del otro antes de dar nuestras propias opiniones o soluciones.",
                svg: `<svg width="300" height="200" viewBox="-150 -50 300 150">
                        ${drawKirby(-40, 40, 1, questionProp)}
                        ${drawWaddleDee(45, 45, 0.9)}
                      </svg>`
            },
            {
                num: "06", title: "Sinergizar",
                quote: "¡Juntos somos más fuertes que separados!",
                explanation: "Es combinar fortalezas y habilidades trabajando en equipo. El resultado del trabajo conjunto (el todo) es mayor que la suma de las partes individuales.",
                svg: `<svg width="300" height="200" viewBox="-150 -50 300 150">
                        ${drawKirby(0, 40, 1)}
                        ${drawWaddleDee(-60, 45, 0.9)}
                        <g transform="translate(60, 45) scale(0.9)">
                            <!-- Waddle Doo (Ojo único) -->
                            <ellipse cx="-15" cy="30" rx="12" ry="6" fill="#f57c00" stroke="#000" stroke-width="2.5"/>
                            <ellipse cx="15" cy="30" rx="12" ry="6" fill="#f57c00" stroke="#000" stroke-width="2.5"/>
                            <circle cx="0" cy="0" r="35" fill="#ef5350" stroke="#000" stroke-width="2.5"/>
                            <circle cx="0" cy="-5" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
                            <circle cx="0" cy="-5" r="5" fill="#000"/>
                            <circle cx="2" cy="-7" r="2" fill="#fff"/>
                        </g>
                      </svg>`
            },
            {
                num: "07", title: "Afilar la sierra",
                quote: "Zzz... Recargando energías para la próxima aventura...",
                explanation: "Se trata de la renovación personal continua (física, mental, emocional y espiritual). Es tomarse el tiempo para descansar, aprender y mantenerse equilibrado.",
                svg: `<svg width="300" height="200" viewBox="-100 -50 200 150">
                        ${drawKirby(0, 50, 1.2, 'sleep' + zzzProp)}
                      </svg>`
            }
        ];

        let currentIndex = 0;

        function renderComic() {
            const container = document.getElementById('comic-container');
            container.innerHTML = '';

            habits.forEach((habit, index) => {
                const panel = document.createElement('div');
                panel.className = 'panel' + (index === currentIndex ? ' active' : '');
                
                panel.innerHTML = `
                    <div class="scene">
                        <div class="speech-bubble">"${habit.quote}"</div>
                        <div class="svg-container">
                            ${habit.svg}
                        </div>
                    </div>
                    <div class="info-box">
                        <div class="habit-title">
                            <div class="habit-num">${habit.num}</div>
                            ${habit.title}
                        </div>
                        <div class="description">
                            ${habit.explanation}
                        </div>
                    </div>
                `;
                container.appendChild(panel);
            });

            // Navigation Controls
            const controls = document.createElement('div');
            controls.className = 'controls';
            controls.innerHTML = `
                <button onclick="changePanel(-1)" ${currentIndex === 0 ? 'disabled' : ''}>&larr; Anterior</button>
                <div class="progress">Panel ${currentIndex + 1} de ${habits.length}</div>
                <button onclick="changePanel(1)" ${currentIndex === habits.length - 1 ? 'disabled' : ''}>Siguiente &rarr;</button>
            `;
            container.appendChild(controls);
        }

        window.changePanel = function(step) {
            currentIndex += step;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= habits.length) currentIndex = habits.length - 1;
            renderComic();
        }

        // Initialize
        renderComic();
    </script>
</body>
</html>
