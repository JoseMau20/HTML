<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal - Clínica Pediátrica</title>
    <link rel="stylesheet" href="../css/sistema.css">
    <script defer src="../app.js"></script>
</head>
<body class="menu-abierto">

    <div id="contenedor-header"></div>
    <div id="contenedor-menu"></div>

    <main class="principal">
        <h2>Gestión de Personal</h2>
        
        <div class="contenedor-tabla">
            <table class="tabla-datos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-personal-body">
                    <tr>
                        <td>1</td>
                        <td>María</td>
                        <td>García</td>
                        <td>maria.garcia@example.com</td>
                        <td><span class="estado-activo">Activo</span></td>
                        <td class="celda-acciones">
                            <button class="btn-accion btn-editar">Editar</button>
                            <button class="btn-accion btn-desactivar">Desactivar</button>
                            <button class="btn-accion btn-eliminar">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="contenedor-footer"></div>
    
</body>
</html>
